kind = "web"
previewPath = "/"
title = "正念咖啡 · Mindful Coffee Munich"
version = "1.0.0"
id = "artifacts/mindful-coffee"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23132

[services.development]
run = "pnpm --filter @workspace/mindful-coffee run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mindful-coffee", "run", "build" ]
publicDir = "artifacts/mindful-coffee/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23132"
BASE_PATH = "/"
